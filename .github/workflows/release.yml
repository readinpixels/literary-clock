# Attaches the plugin zip to the release of a version tag (e.g. v0.1.0).
# The zip holds only the literaryclock.koplugin/ folder, the layout KOReader
# plugin stores (Storefront, App Store) install from.
#
# Works both ways: push a tag and the release is created; or create the
# release on GitHub (with a new tag) and the zip is added to it.
name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

# Creating a release on GitHub can fire both events: run them one after the
# other, so the second finds the release and only refreshes the zip.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches _meta.lua
        run: |
          meta=$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' literaryclock.koplugin/_meta.lua)
          if [ "v$meta" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match _meta.lua version $meta"
            exit 1
          fi

      - name: Build the zip
        run: zip -r "literaryclock.koplugin-$GITHUB_REF_NAME.zip" literaryclock.koplugin

      - name: Create the release or add the zip to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="literaryclock.koplugin-$GITHUB_REF_NAME.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
